name: Deploy

on:
  push:
    branches:
      - develop
      - 'test/**'
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pii-tool
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pii-tool
      - name: Run tests
        run: cargo test --workspace

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine environment
        id: env
        run: |
          REF="${{ github.ref }}"
          if [[ "$REF" == "refs/heads/develop" ]]; then
            echo "name=dev" >> $GITHUB_OUTPUT
            echo "lambda=poco-pii-api-handler-dev" >> $GITHUB_OUTPUT
          elif [[ "$REF" == refs/heads/test/* ]]; then
            echo "name=test" >> $GITHUB_OUTPUT
            echo "lambda=poco-pii-api-handler-test" >> $GITHUB_OUTPUT
          elif [[ "$REF" == refs/heads/release/* ]]; then
            echo "name=staging" >> $GITHUB_OUTPUT
            echo "lambda=poco-pii-api-handler-staging" >> $GITHUB_OUTPUT
          else
            echo "Unknown branch: $REF"
            exit 1
          fi

      - name: Build inside Amazon Linux 2023
        run: |
          docker run --rm \
            -v "$PWD":/work \
            -w /work/pii-tool \
            amazonlinux:2023 \
            bash -c '
              set -euo pipefail
              dnf install -y gcc gcc-c++ make openssl-devel zip unzip curl
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
              . "$HOME/.cargo/env"
              cargo build --release -p poco-lambda
              mkdir -p target/lambda/poco-lambda
              cp target/release/poco-lambda target/lambda/poco-lambda/bootstrap
              cd target/lambda/poco-lambda
              zip -q bootstrap.zip bootstrap
              echo "=== zip contents ==="
              unzip -l bootstrap.zip
            '

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ steps.env.outputs.lambda }} \
            --zip-file fileb://pii-tool/target/lambda/poco-lambda/bootstrap.zip \
            --region us-east-1
          aws lambda wait function-updated \
            --function-name ${{ steps.env.outputs.lambda }} \
            --region us-east-1

      - name: Smoke test
        run: |
          URL="https://6xz841x652.execute-api.us-east-1.amazonaws.com/${{ steps.env.outputs.name }}/health"
          for i in 1 2 3; do
            STATUS=$(curl -s -o /tmp/health_body -w "%{http_code}" "$URL" || true)
            echo "Attempt $i: HTTP $STATUS"
            echo "body: $(cat /tmp/health_body 2>/dev/null || true)"
            if [ "$STATUS" = "200" ]; then
              echo "✓ Smoke test passed"
              exit 0
            fi
            sleep 5
          done
          echo "✗ Smoke test failed"
          exit 1