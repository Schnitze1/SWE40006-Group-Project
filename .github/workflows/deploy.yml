# AWS Academy Learner Lab deployment — routes by branch to dev/test/staging/prod.
#
# Hard constraints (do not "fix" by adding IAM/OIDC):
#   * Region is locked to us-east-1 (hardcoded — do not parameterise).
#   * No IAM role creation, no OIDC providers. Runtime uses the pre-existing LabRole.
#   * GitHub Actions auth uses static credentials in GitHub secrets only.
#   * Deploy is update-function-code only.

name: Deploy

on:
  push:
    branches:
      - develop
      - 'test/**'
      - 'release/**'
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pii-tool
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pii-tool
      - name: Run tests
        run: cargo test --workspace

  deploy:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pii-tool
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pii-tool

      - name: Determine environment
        id: env
        run: |
          REF="${{ github.ref }}"
          if [[ "$REF" == "refs/heads/develop" ]]; then
            echo "name=dev" >> $GITHUB_OUTPUT
            echo "lambda=poco-pii-api-handler-dev" >> $GITHUB_OUTPUT
          elif [[ "$REF" == refs/heads/test/* ]]; then
            echo "name=test" >> $GITHUB_OUTPUT
            echo "lambda=poco-pii-api-handler-test" >> $GITHUB_OUTPUT
          elif [[ "$REF" == refs/heads/release/* ]]; then
            echo "name=staging" >> $GITHUB_OUTPUT
            echo "lambda=poco-pii-api-handler-staging" >> $GITHUB_OUTPUT
          elif [[ "$REF" == "refs/heads/main" ]]; then
            echo "name=prod" >> $GITHUB_OUTPUT
            echo "lambda=poco-pii-api-handler" >> $GITHUB_OUTPUT
          else
            echo "Unknown branch: $REF"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Install aarch64 GNU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-aarch64-linux-gnu

      - name: Install cargo-lambda
        run: pip install cargo-lambda

      - name: Build Lambda
        env:
          # ONNX Runtime (ort-sys) is C++; g++ as linker pulls in libstdc++.
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-g++
          CXXSTDLIB: stdc++
          RUSTFLAGS: "-C link-arg=-lstdc++"
        run: |
          set -euo pipefail
          cargo lambda build --release --arm64 -p poco-lambda
          echo "=== target/lambda contents ==="
          find target/lambda -type f 2>/dev/null | head -50 || true
          BOOTDIR="target/lambda/poco-lambda"
          mkdir -p "$BOOTDIR"
          # cargo-lambda may emit bootstrap, bootstrap.zip, or <name>.zip
          if [ -f "$BOOTDIR/bootstrap.zip" ]; then
            echo "found $BOOTDIR/bootstrap.zip"
          elif [ -f "$BOOTDIR/bootstrap" ]; then
            (cd "$BOOTDIR" && zip -q bootstrap.zip bootstrap)
            echo "zipped bootstrap binary"
          else
            ZIP="$(find target/lambda -name '*.zip' -type f 2>/dev/null | head -n1 || true)"
            BIN="$(find target/lambda -type f -name 'bootstrap*' 2>/dev/null | head -n1 || true)"
            if [ -n "$ZIP" ]; then
              cp "$ZIP" "$BOOTDIR/bootstrap.zip"
              echo "copied $ZIP"
            elif [ -n "$BIN" ]; then
              cp "$BIN" "$BOOTDIR/bootstrap"
              (cd "$BOOTDIR" && zip -q bootstrap.zip bootstrap)
              echo "packed $BIN"
            else
              echo "No bootstrap artifact under target/lambda"
              find target -type f -name '*poco*' 2>/dev/null | head -50 || true
              exit 1
            fi
          fi
          ls -la "$BOOTDIR"

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ steps.env.outputs.lambda }} \
            --zip-file fileb://target/lambda/poco-lambda/bootstrap.zip \
            --region us-east-1
          aws lambda wait function-updated \
            --function-name ${{ steps.env.outputs.lambda }} \
            --region us-east-1

      - name: Smoke test
        run: |
          URL="https://6xz841x652.execute-api.us-east-1.amazonaws.com/${{ steps.env.outputs.name }}/health"
          echo "Testing $URL"
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✓ Smoke test passed"
              curl -s "$URL"
              exit 0
            fi
            sleep 5
          done
          echo "✗ Smoke test failed"
          exit 1
