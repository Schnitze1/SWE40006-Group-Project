name: Deploy

on:
  push:
    branches:
      - develop
      - 'test/**'
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pii-tool
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pii-tool
      - name: Run tests
        run: cargo test --workspace -- --test-threads=1

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine environment
        id: env
        run: |
          REF="${{ github.ref }}"
          if [[ "$REF" == "refs/heads/develop" ]]; then
            echo "name=dev" >> $GITHUB_OUTPUT
            echo "lambda=poco-pii-api-handler-dev" >> $GITHUB_OUTPUT
          elif [[ "$REF" == refs/heads/test/* ]]; then
            echo "name=test" >> $GITHUB_OUTPUT
            echo "lambda=poco-pii-api-handler-test" >> $GITHUB_OUTPUT
          elif [[ "$REF" == refs/heads/release/* ]]; then
            echo "name=staging" >> $GITHUB_OUTPUT
            echo "lambda=poco-pii-api-handler-staging" >> $GITHUB_OUTPUT
          else
            echo "Unknown branch: $REF"
            exit 1
          fi

      - name: Build inside cargo-lambda container
        run: |
          docker run --rm \
            -v "$PWD":/work \
            -w /work/pii-tool \
            ghcr.io/cargo-lambda/cargo-lambda:latest \
            cargo lambda build --release --compiler cargo -p poco-lambda --output-format zip

      - name: Verify artifact
        run: |
          echo "=== searching for bootstrap.zip ==="
          find pii-tool/target -name "bootstrap.zip" -type f
          ZIP=$(find pii-tool/target -name "bootstrap.zip" -type f | head -n1)
          echo "Found: $ZIP"
          unzip -l "$ZIP"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Deploy to Lambda
        run: |
          ZIP=$(find pii-tool/target -name "bootstrap.zip" -type f | head -n1)
          aws lambda update-function-code \
            --function-name ${{ steps.env.outputs.lambda }} \
            --zip-file fileb://$ZIP \
            --region us-east-1
          aws lambda wait function-updated \
            --function-name ${{ steps.env.outputs.lambda }} \
            --region us-east-1

      - name: Smoke test
        run: |
          URL="https://6xz841x652.execute-api.us-east-1.amazonaws.com/${{ steps.env.outputs.name }}/health"
          for i in 1 2 3; do
            STATUS=$(curl -s -o /tmp/health_body -w "%{http_code}" "$URL" || true)
            echo "Attempt $i: HTTP $STATUS"
            echo "body: $(cat /tmp/health_body 2>/dev/null || true)"
            if [ "$STATUS" = "200" ]; then
              echo "✓ Smoke test passed"
              exit 0
            fi
            sleep 5
          done
          echo "✗ Smoke test failed"
          exit 1