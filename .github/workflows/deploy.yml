name: Deploy

on:
  push:
    branches:
      - develop
      - 'test/**'
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pii-tool
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pii-tool
      - name: Run tests
        run: cargo test --workspace

  deploy:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pii-tool
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pii-tool

      - name: Determine environment
        id: env
        run: |
          REF="${{ github.ref }}"
          if [[ "$REF" == "refs/heads/develop" ]]; then
            echo "name=dev" >> $GITHUB_OUTPUT
            echo "lambda=poco-pii-api-handler-dev" >> $GITHUB_OUTPUT
          elif [[ "$REF" == refs/heads/test/* ]]; then
            echo "name=test" >> $GITHUB_OUTPUT
            echo "lambda=poco-pii-api-handler-test" >> $GITHUB_OUTPUT
          elif [[ "$REF" == refs/heads/release/* ]]; then
            echo "name=staging" >> $GITHUB_OUTPUT
            echo "lambda=poco-pii-api-handler-staging" >> $GITHUB_OUTPUT
          else
            echo "Unknown branch: $REF"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Install cargo-lambda
        run: pip install cargo-lambda

      - name: Build Lambda
        run: |
          set -euo pipefail
          cargo lambda build --release \
            --target x86_64-unknown-linux-gnu.2.34 \
            -p poco-lambda \
            --output-format zip
          echo "=== artifact search ==="
          find target -name "*.zip" -type f
          ARTIFACT=$(find target -name "bootstrap.zip" -type f | head -n1)
          echo "Found: $ARTIFACT"
          unzip -l "$ARTIFACT"

      - name: Locate artifact
        id: artifact
        run: |
          ARTIFACT=$(find target -name "bootstrap.zip" -type f | head -n1)
          if [ -z "$ARTIFACT" ]; then
            echo "No bootstrap.zip found"
            exit 1
          fi
          echo "path=$ARTIFACT" >> $GITHUB_OUTPUT

      - name: Deploy to Lambda
        run: |
          set -euo pipefail
          aws lambda update-function-code \
            --function-name ${{ steps.env.outputs.lambda }} \
            --zip-file fileb://${{ steps.artifact.outputs.path }} \
            --region us-east-1
          aws lambda wait function-updated \
            --function-name ${{ steps.env.outputs.lambda }} \
            --region us-east-1

      - name: Smoke test
        run: |
          URL="https://6xz841x652.execute-api.us-east-1.amazonaws.com/${{ steps.env.outputs.name }}/health"
          echo "Testing $URL"
          for i in 1 2 3; do
            STATUS=$(curl -s -o /tmp/health_body -w "%{http_code}" "$URL" || true)
            echo "Attempt $i: HTTP $STATUS"
            echo "body: $(cat /tmp/health_body 2>/dev/null || true)"
            if [ "$STATUS" = "200" ]; then
              echo "✓ Smoke test passed"
              exit 0
            fi
            sleep 5
          done
          echo "✗ Smoke test failed"
          exit 1