schema_version = "0.1.0"
rulepack_id = "pii-poc-extra"
rulepack_version = "0.1.0"
default_locales = ["global"]

# Titles + person names: "Dr. Sarah Mitchell", "Ms. Priya Patel", "Prof. James O'Brien-Smith"
# Allow apostrophes and hyphens in surnames (O'Brien-Smith) and Latin accents (José Müller).
[[recognizers]]
id = "name.title"
safety_tier = "safe_default"
class = "Name"
cooperates_with = ["name.cue", "name.role_comma", "name.role_label", "name.signature", "name.dash_role", "name.paren_email", "name.cjk", "email.header.name", "email.header.name.paren", "name.forward_marker", "name.agent_recipient", "name.auto_footer"]
enabled = true
locales = ["global"]

[recognizers.match]
kind = "regex"
pattern = '''\b((?:Dr|Mr|Ms|Mrs|Mx|Prof)\.?\s+[A-ZÀ-Þ][\w'’À-ÖØ-öø-ÿ-]+(?:\s+[A-Z]\.?)?(?:\s+[A-ZÀ-Þ][\w'’À-ÖØ-öø-ÿ-]+)+)'''
capture_groups = [1]

[recognizers.scoring]
base = 0.90
priority = 120

[recognizers.token]
family = "name.counter"

# Cue + person names. Only the cue is case-insensitive. Allow ':', ',', or space
# after the cue so "Hiring manager: Priya Patel" works.
[[recognizers]]
id = "name.cue"
safety_tier = "safe_default"
class = "Name"
cooperates_with = ["name.title", "name.role_comma", "name.role_label", "name.signature", "name.dash_role", "name.paren_email", "name.cjk", "email.header.name", "email.header.name.paren", "name.forward_marker", "name.agent_recipient", "name.auto_footer"]
enabled = true
locales = ["global"]

[recognizers.match]
kind = "regex"
pattern = '''\b(?i:under\s+the\s+name|account\s+for|name\s+is|named|contact|\bcc\b|c\.c\.|reach\s+out\s+to|please\s+reach\s+out\s+to|hiring\s+manager|emergency\s+contact|reference\s+contact|manager|recruiter|coordinator|supervisor)\s*[:,]?\s+((?:(?:Dr|Mr|Ms|Mrs|Mx|Prof)\.?\s+)?[A-ZÀ-Þ][\w'’À-ÖØ-öø-ÿ-]+(?:\s+[A-Z]\.?)?(?:\s+[A-ZÀ-Þ][\w'’À-ÖØ-öø-ÿ-]+)+)'''
capture_groups = [1]

[recognizers.scoring]
base = 0.88
priority = 115

[recognizers.token]
family = "name.counter"

# Role, First Last — "the hiring manager, Priya Patel"
[[recognizers]]
id = "name.role_comma"
safety_tier = "safe_default"
class = "Name"
cooperates_with = ["name.title", "name.cue", "name.role_label", "name.signature", "name.dash_role", "name.paren_email", "name.cjk", "email.header.name", "email.header.name.paren", "name.forward_marker", "name.agent_recipient", "name.auto_footer"]
enabled = true
locales = ["global"]

[recognizers.match]
kind = "regex"
pattern = '''\b(?i:hiring\s+manager|emergency\s+contact|reference\s+contact|manager|recruiter|coordinator|supervisor|director|contact|lead)\s*,\s*((?:Dr|Mr|Ms|Mrs|Mx|Prof)\.?\s+)?([A-ZÀ-Þ][\w'’À-ÖØ-öø-ÿ-]+(?:\s+[A-Z]\.?)?(?:\s+[A-ZÀ-Þ][\w'’À-ÖØ-öø-ÿ-]+)+)'''
capture_groups = [2]

[recognizers.scoring]
base = 0.90
priority = 116

[recognizers.token]
family = "name.counter"

# Label-colon names: "Hiring manager: Priya Patel", "Emergency contact: Michael Chen (spouse)"
[[recognizers]]
id = "name.role_label"
safety_tier = "safe_default"
class = "Name"
cooperates_with = ["name.title", "name.cue", "name.role_comma", "name.signature", "name.dash_role", "name.paren_email", "name.cjk", "email.header.name"]
enabled = true
locales = ["global"]

[recognizers.match]
kind = "regex"
pattern = '''\b(?i:hiring\s+manager|emergency\s+contact|reference\s+contact|primary\s+candidate|candidate|contact\s+details)\s*:\s*((?:(?:Dr|Mr|Ms|Mrs|Mx|Prof)\.?\s+)?[A-ZÀ-Þ][\w'’À-ÖØ-öø-ÿ-]+(?:\s+[A-Z]\.?)?(?:\s+[A-ZÀ-Þ][\w'’À-ÖØ-öø-ÿ-]+)*)'''
capture_groups = [1]

[recognizers.scoring]
base = 0.91
priority = 118

[recognizers.token]
family = "name.counter"

# Signature lines: "/s/ Sarah E. Mitchell"
[[recognizers]]
id = "name.signature"
safety_tier = "safe_default"
class = "Name"
cooperates_with = ["name.title", "name.cue", "name.role_label", "name.role_comma", "name.dash_role", "name.paren_email", "name.cjk"]
enabled = true
locales = ["global"]

[recognizers.match]
kind = "regex"
pattern = '''(?:/s/|Signed:)\s*((?:Dr|Mr|Ms|Mrs|Mx|Prof)\.?\s+)?([A-ZÀ-Þ][\w'’À-ÖØ-öø-ÿ-]+(?:\s+[A-Z]\.?)?(?:\s+[A-ZÀ-Þ][\w'’À-ÖØ-öø-ÿ-]+)+)'''
capture_groups = [2]

[recognizers.scoring]
base = 0.92
priority = 122

[recognizers.token]
family = "name.counter"

# Loose North-American phone so fixture numbers like (555) 867-5309 are redacted
# even when the strict E.164 parser rejects them.
[[recognizers]]
id = "phone.na.loose"
safety_tier = "safe_default"
class = "custom:phone"
cooperates_with = ["phone.structural", "phone.e164.spaced", "phone.national.de", "phone.national.us", "phone.e164.intl", "phone.au", "phone.dotted"]
enabled = true
locales = ["global"]

[recognizers.match]
kind = "regex"
pattern = '''(?:^|[^[:alnum:]_+])((?:\+?1[\s.-]*)?(?:\([2-9]\d{2}\)|[2-9]\d{2})[\s.-]*[2-9]\d{2}[\s.-]*\d{4})\b'''
capture_groups = [1]

[recognizers.scoring]
base = 0.75
priority = 70

[recognizers.token]

# E.164 international / German landline style: +49 30 1234 5678, +61 412 345 678,
# +1-617-555-0198, +86 138 0013 8000. Requires a leading '+' so dates/refs are safe.
[[recognizers]]
id = "phone.e164.intl"
safety_tier = "safe_default"
class = "custom:phone"
cooperates_with = ["phone.structural", "phone.e164.spaced", "phone.national.de", "phone.national.us", "phone.na.loose", "phone.au", "phone.dotted"]
enabled = true
locales = ["global"]

[recognizers.match]
kind = "regex"
pattern = '''(?:^|[^[:alnum:]_+])(\+[1-9]\d{0,2}[\s\-]?(?:\d[\s\-]?){6,14}\d)\b'''
capture_groups = [1]

[recognizers.scoring]
base = 0.80
priority = 82

[recognizers.token]

# SSN with flexible cue spacing ("SSN 123-45-6789", "SSN on file is 123-45-6789").
# core's ssn.us only allows [:#-]? between the cue and the number.
[[recognizers]]
id = "ssn.poc"
safety_tier = "safe_default"
class = "custom:ssn"
cooperates_with = ["ssn.us", "id.tfn", "id.medicare", "id.dln", "id.employee", "id.passport"]
enabled = true
locales = ["global"]

[recognizers.match]
kind = "regex"
pattern = '''(?i)\b(?:ssn|social\s+security(?:\s+number)?|ss#)\s*(?:on\s+file\s+(?:is|as)\s+|number\s*(?:is|:)\s+|is\s+|:\s+|#\s+|-?\s*)?(\d{3}-\d{2}-\d{4}|\d{9})\b'''
capture_groups = [1]

[recognizers.scoring]
base = 0.90
priority = 110

[recognizers.token]

# ISO dates: 2024-03-15
[[recognizers]]
id = "date.iso"
safety_tier = "safe_default"
class = "custom:date"
cooperates_with = ["date.us", "date.mon"]
enabled = true
locales = ["global"]

[recognizers.match]
kind = "regex"
pattern = '''\b(\d{4}-\d{2}-\d{2})\b'''
capture_groups = [1]

[recognizers.scoring]
base = 0.85
priority = 95

[recognizers.token]

# US dates: 03/15/2024 or 3/15/24
[[recognizers]]
id = "date.us"
safety_tier = "safe_default"
class = "custom:date"
cooperates_with = ["date.iso", "date.mon"]
enabled = true
locales = ["global"]

[recognizers.match]
kind = "regex"
pattern = '''\b(\d{1,2}/\d{1,2}/\d{2,4})\b'''
capture_groups = [1]

[recognizers.scoring]
base = 0.80
priority = 94

[recognizers.token]

# DD Mon YYYY / DD Month YYYY: "12 Nov 2031", "22 Sept 2026", "24 September 2026"
[[recognizers]]
id = "date.mon"
safety_tier = "safe_default"
class = "custom:date"
cooperates_with = ["date.iso", "date.us"]
enabled = true
locales = ["global"]

[recognizers.match]
kind = "regex"
pattern = '''(?i)\b(\d{1,2}\s+(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:t(?:ember)?)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\.?\s+\d{4})\b'''
capture_groups = [1]

[recognizers.scoring]
base = 0.88
priority = 96

[recognizers.token]

# IPv4 CIDR as one token so the /prefix is not left dangling: 10.0.14.0/24
[[recognizers]]
id = "ip.v4.cidr"
safety_tier = "safe_default"
class = "custom:ip_address"
cooperates_with = ["ip.v4", "ip.v6"]
enabled = true
locales = ["global"]

[recognizers.match]
kind = "regex"
pattern = '''\b((?:(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)/\d{1,2})\b'''
capture_groups = [1]

[recognizers.scoring]
base = 0.85
priority = 100

[recognizers.token]

# Full street address: 42 Beacon Street, Boston, MA 02108
[[recognizers]]
id = "location.street_full"
safety_tier = "safe_default"
class = "location"
cooperates_with = ["location.street", "location.city_state_zip", "location.au_locality", "location.unit"]
enabled = true
locales = ["global"]

[recognizers.match]
kind = "regex"
pattern = '''\b(\d{1,5}\s+(?:[A-Z][a-z]+\s+){1,4}(?:Street|St|Avenue|Ave|Road|Rd|Boulevard|Blvd|Lane|Ln|Drive|Dr|Court|Ct|Way|Place|Pl)\.?,\s*[A-Z][a-z]+(?:\s+[A-Z][a-z]+)*,\s*[A-Z]{2}\s*\d{5})\b'''
capture_groups = [1]

[recognizers.scoring]
base = 0.92
priority = 125

[recognizers.token]

# Street only: 42 Beacon Street, 1 Parliament Square, … Harbour Esplanade
