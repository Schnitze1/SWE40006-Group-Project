[recognizers.match]
kind = "regex"
pattern = '''\b(\d{1,5}\s+(?:[A-Z][\w'’-]+\s+){1,4}(?:Street|St|Avenue|Ave|Road|Rd|Boulevard|Blvd|Lane|Ln|Drive|Dr|Court|Ct|Way|Place|Pl|Square|Sq|Esplanade|Esp|Parade|Pde|Terrace|Tce)\.?)\b'''
